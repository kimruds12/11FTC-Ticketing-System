name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # M3 / M8 both talk to real infrastructure. The concurrency test needs Postgres.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ticketing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ticketing_test
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # --- Invariants that prose cannot enforce ---

      - name: Agent instructions in sync with CLAUDE.md
        run: pnpm check:agents

      - name: Skill mirrors in sync with canonical skills/
        run: pnpm check:skills

      - name: No DELETE against tickets / audit_log (FR-9, FR-35)
        run: pnpm check:no-delete

      - name: Requirements <-> design traceability
        run: pnpm check:traceability

      # --- Standard gates ---

      - name: Lint
        run: pnpm lint

      - name: Typecheck (tsc --noEmit, strict)
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # --- The test that is the spec for M3 ---
      # 50 simultaneous encodes, one date, 50 distinct ticket numbers.
      # Stubbed to FAIL LOUDLY until M3 exists — do not make it pass by weakening it.
      - name: Concurrency — 50 encodes, one date, 50 distinct numbers (FR-4/FR-5)
        run: pnpm test:concurrency
