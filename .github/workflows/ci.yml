name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json "packageManager" — do NOT also set it here,
      # or action-setup errors with ERR_PNPM_BAD_PM_VERSION on the duplicate.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck (tsc --noEmit, strict)
        run: pnpm typecheck

# ─────────────────────────────────────────────────────────────────────────────────────
# DEFERRED — turn these on one-by-one as modules land. Kept here (not deleted) so re-enabling
# is a copy-paste, not a rewrite. All of them pass TODAY except `test:concurrency`, which is
# the intentionally-RED spec-gate for M3 (see .claude/rules/numbering.md).
